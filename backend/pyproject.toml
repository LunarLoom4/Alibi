# Tells pip how to build and install this project
[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

# Project metadata and the direct dependencies, pinned to exact versions
[project]
name = "alibi"
version = "0.1.0"
description = "Backend of Alibi, a multiplayer murder mystery game with AI suspects and detectives."
requires-python = ">=3.15"
dependencies = [
    # Web framework and the ASGI server that runs it
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

# Tools needed ONLY while developing and testing, installed with '.[dev]'.
[project.optional-dependencies]
dev = [
    # Test Runner and the HTTP Client behind FastAPI's TestClient.
    "pytest==9.2.0",
    "httpx2==2.16.0",

    # Runs the tests in several Processes at once, as many as '-n' asks for.
    "pytest-xdist==3.8.0",
]

# The importable package lives in 'src/alibi/'
[tool.setuptools.packages.find]
where = ["src"]

# Settings for pytest: Run the tests in 10 Worker Processes at once, through pytest-xdist. '-n 0' runs them in one Process.
[tool.pytest.ini_options]
addopts = "-n 10"
